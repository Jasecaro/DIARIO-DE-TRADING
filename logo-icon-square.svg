<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBoltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <linearGradient id="sqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="sqNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="56" fill="url(#sqBgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Chart Grid Line -->
  <line x1="32" y1="180" x2="224" y2="180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="32" y1="120" x2="224" y2="120" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Glowing Ascending Lightning Arrow -->
  <g transform="translate(48, 42)" filter="url(#sqShadow)">
    <!-- Soft Glow Backdrop -->
    <path d="M 22 152 L 68 86 L 48 86 L 96 24 L 78 24 L 132 4 L 148 44 L 126 38 L 90 98 L 112 98 L 40 152 Z" 
          fill="#00f5a0" opacity="0.25" filter="url(#sqNeonGlow)"/>

    <!-- Main Solid Arrow -->
    <path d="M 26 148 L 70 84 L 50 84 L 96 22 L 76 22 L 134 2 L 148 46 L 126 40 L 92 100 L 114 100 L 44 148 Z" 
          fill="url(#sqBoltGrad)"/>

    <!-- Sharp Bevel Core -->
    <path d="M 38 138 L 74 86 L 56 86 L 98 26 L 84 26 L 130 8" 
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
          
    <!-- Arrowhead Apex Dot -->
    <circle cx="134" cy="2" r="4.5" fill="#00f5a0" filter="url(#sqNeonGlow)"/>
  </g>

  <!-- Mini Brand Text at bottom -->
  <text x="128" y="222" 
        font-family="'Inter', sans-serif" 
        font-weight="800" 
        font-size="13" 
        letter-spacing="5" 
        fill="#94a3b8" 
        text-anchor="middle">
    THERAISETRADER
  </text>
</svg>
