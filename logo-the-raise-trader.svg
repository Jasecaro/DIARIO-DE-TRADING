<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradients -->
    <linearGradient id="boltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Optional Background (Dark Obsidian) -->
  <rect width="600" height="200" rx="16" fill="#090d16" />

  <!-- Grid Ambient Lines (Subtle) -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="40" y1="40" x2="560" y2="40" stroke-dasharray="4 4" />
    <line x1="40" y1="100" x2="560" y2="100" stroke-dasharray="4 4" />
    <line x1="40" y1="160" x2="560" y2="160" stroke-dasharray="4 4" />
  </g>

  <!-- ==================== THE RAISE LIGHTNING ARROW ICON ==================== -->
  <g transform="translate(45, 25)" filter="url(#subtleShadow)">
    <!-- Outer Glow Shadow -->
    <path d="M 25 145 L 62 82 L 48 82 L 82 28 L 68 28 L 105 10 L 118 42 L 102 38 L 72 88 L 88 88 L 38 145 Z" 
          fill="#00f5a0" opacity="0.3" filter="url(#neonGlow)" />

    <!-- Main Dynamic Arrow Body -->
    <path d="M 28 142 L 64 80 L 48 80 L 82 26 L 66 26 L 108 8 L 118 44 L 102 39 L 72 90 L 90 90 L 42 142 Z" 
          fill="url(#boltGrad)" />

    <!-- Sharp Internal Bevel / Highlight Line -->
    <path d="M 36 135 L 67 82 L 53 82 L 84 28 L 72 28 L 105 14" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
          
    <!-- Upward Trend Point Accent -->
    <circle cx="108" cy="8" r="4" fill="#00f5a0" filter="url(#neonGlow)" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRAND TEXT ==================== -->
  <!-- "THE RAISE" -->
  <g transform="translate(195, 88)">
    <text font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-weight="800" 
          font-size="44" 
          letter-spacing="3" 
          fill="url(#textGrad)">
      THE <tspan fill="url(#boltGrad)">RAISE</tspan>
    </text>
  </g>

  <!-- "TRADER" TECH BADGE -->
  <g transform="translate(195, 108)">
    <!-- Badge Background Pill -->
    <rect x="0" y="5" width="220" height="42" rx="8" 
          fill="url(#badgeGrad)" 
          stroke="url(#boltGrad)" 
          stroke-width="1.8" />
    
    <!-- Accent side notches -->
    <rect x="212" y="18" width="4" height="16" rx="2" fill="#00f5a0" />
    <circle cx="16" cy="26" r="3" fill="#00f2fe" />

    <!-- "TRADER" Text -->
    <text x="114" y="33" 
          font-family="'JetBrains Mono', 'Orbitron', 'Inter', monospace" 
          font-weight="800" 
          font-size="22" 
          letter-spacing="9" 
          fill="#00f2fe" 
          text-anchor="middle">
      TRADER
    </text>
  </g>

  <!-- Small PRO / AI Tag -->
  <g transform="translate(430, 113)">
    <rect x="0" y="5" width="55" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="27.5" y="22" 
          font-family="'Inter', sans-serif" 
          font-weight="700" 
          font-size="11" 
          letter-spacing="1" 
          fill="#94a3b8" 
          text-anchor="middle">
      PRO
    </text>
  </g>

</svg>
