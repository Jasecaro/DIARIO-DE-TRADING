<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Subtle Grid Lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Candlesticks -->
  <!-- Candle 1 (Red / Drop) -->
  <line x1="20" y1="26" x2="20" y2="42" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <rect x="17.5" y="30" width="5" height="8" rx="1.5" fill="#ef4444"/>
  
  <!-- Candle 2 (Green / Rise) -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="29.5" y="22" width="5" height="14" rx="1.5" fill="#10b981"/>
  
  <!-- Candle 3 (Green / Strong Rise) -->
  <line x1="44" y1="12" x2="44" y2="34" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="41.5" y="15" width="5" height="15" rx="1.5" fill="#10b981"/>

  <!-- Upward Trend Line with Glow -->
  <path d="M 16 38 L 28 27 L 44 14" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="14" r="3" fill="#60a5fa"/>
</svg>
